[package]
name = "shieldtray"
description = "shieldd's tray: what it shows and sends back, and the Windows tray itself"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
shieldutl = { workspace = true, features = ["vban"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Icons from shieldtray/res/*.svg; no text or raster images in them
resvg = { version = "0.48", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
