[package]
name = "shieldutl"
description = "Small pieces shared by rtlusb and shieldd: MAC formatting, base64, and psk= values with their DPAPI seal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Log files and the tracing setup, for the binaries
logs = ["gzip", "dep:tracing", "dep:tracing-subscriber"]
# Gzipped files: packed logs, conf backups
gzip = ["dep:flate2"]
# Controller audio to and from Voicemeeter
vban = ["dep:tracing"]

[dependencies]
anyhow.workspace = true
flate2 = { version = "1.1", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# The seal on a psk= value; elsewhere a sealed one is refused
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Security_Cryptography"]

# Its own tests cover the gzip helpers too
[dev-dependencies]
shieldutl = { path = ".", features = ["gzip"] }
