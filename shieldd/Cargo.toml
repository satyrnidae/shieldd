[package]
name = "shieldd"
description = "Windows host for the 2015 NVIDIA SHIELD controller over Wi-Fi Direct + Ozmo, plus the WSL bridge (--transmit / --receiver)"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ozproto.workspace = true
shdlink.workspace = true
shieldtray.workspace = true
shieldutl = { workspace = true, features = ["logs", "vban"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true

# The host and --receiver: Windows only
[target.'cfg(windows)'.dependencies]
ctrlc.workspace = true
rtlusb.workspace = true
rand = "0.8"
names = { version = "0.14", default-features = false }
vigem-client.workspace = true

# --transmit: the WSL side
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
