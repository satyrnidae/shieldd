[package]
name = "shieldd"
description = "Windows and Linux host for the 2015 NVIDIA SHIELD controller over Wi-Fi Direct + Ozmo, plus the WSL bridge (--transmit / --receiver)"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tray"]
# The tray on Linux (GTK 4 and D-Bus); without it, hosting runs headless and the tray's
# notifications go to the log. Off for a build that only runs --transmit: --no-default-features.
# Windows' tray is always there.
tray = ["shdtray/tray"]

[dependencies]
shdnet.workspace = true
ozproto.workspace = true
shdlink.workspace = true
shdtray.workspace = true
shdlib = { workspace = true, features = ["gzip", "logs", "vban"] }
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
ctrlc.workspace = true
rtlusb.workspace = true
rand = "0.8"
names = { version = "0.14", default-features = false }

[build-dependencies]
# The About box's build date
shdlib.workspace = true

[dev-dependencies]
# Reading backups back in tests
flate2 = "1.1"

# The outputs, through ViGEmBus
[target.'cfg(windows)'.dependencies]
vigem-client.workspace = true

# --transmit, the WSL side; the outputs, through uinput; and --stop's SIGTERM
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
evdev = "0.13.2"
ctrlc = { workspace = true, features = ["termination"] }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
