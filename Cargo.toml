[workspace]
resolver = "3"
members = ["ozproto", "rtlusb", "shdlink", "shieldd"]

[workspace.package]
version = "0.1.0+alpha"
authors = ["Isabel Maskrey"]
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
ozproto = { path = "ozproto" }
rtlusb = { path = "rtlusb" }
shdlink = { path = "shdlink" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Notifications carry the game's rumble back from the virtual pad
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
windows = "0.62.2"
