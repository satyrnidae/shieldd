[package]
name = "shdtray"
description = "shieldd's tray: what it shows and sends back, and the Windows tray itself"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shdnet.workspace = true
anyhow.workspace = true
# UI text, from res/locales/*/shdtray.ftl
fluent-bundle = "0.16.0"
shdlib = { workspace = true, features = ["audio"] }
tracing.workspace = true
unic-langid = "0.9.6"
# Icons from shdtray/res/*.svg; no text or raster images in them
resvg = { version = "0.48", default-features = false }

[features]
# The Linux tray: the icon through StatusNotifierItem (ksni), notifications over D-Bus, and its
# boxes in GTK 4. Without it, Linux gets the headless one, which only logs. Windows' tray is always
# there.
tray = ["dep:ksni", "dep:zbus", "dep:gtk4", "dep:libc"]

[dev-dependencies]
# The message ids in each .ftl, for the tests
fluent-syntax = "0.12.0"
# The tray example's logs
tracing-subscriber.workspace = true

[[example]]
name = "tray"
required-features = ["tray"]

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# AlertDialog is 4.10
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
# dlopen for libcanberra's event sounds, silent without it
libc = { workspace = true, optional = true }
