[package]
name = "shdtray"
description = "shieldd's tray: what it shows and sends back, and the Windows tray itself"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shdnet.workspace = true
anyhow.workspace = true
# UI text, from res/locales/*/shdtray.ftl
fluent-bundle = "0.16.0"
shdlib = { workspace = true, features = ["vban"] }
tracing.workspace = true
unic-langid = "0.9.6"

[dev-dependencies]
# The message ids in each .ftl, for the tests
fluent-syntax = "0.12.0"

[target.'cfg(windows)'.dependencies]
# Icons from shdtray/res/*.svg; no text or raster images in them
resvg = { version = "0.48", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
